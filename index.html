<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock Sincronizada con Auditoría</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-100 min-h-screen p-4 md:p-6">

    <!-- CONTENEDOR DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="authContainer" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-12 hidden">
        <h2 id="authTitle" class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 Iniciar Sesión</h2>
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
                <input type="email" id="authEmail" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                <input type="password" id="authPassword" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <button type="submit" id="authButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition">Entrar</button>
        </form>
        <p class="text-center text-xs text-gray-500 mt-4 cursor-pointer hover:underline" id="toggleAuthMode">¿No tienes cuenta? Regístrate aquí</p>
        <p id="authError" class="text-center text-xs text-red-600 mt-2 font-semibold"></p>
    </div>

    <!-- APLICACIÓN PRINCIPAL DE STOCK (Oculta hasta iniciar sesión) -->
    <div id="appContainer" class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 hidden">
        <!-- Cabecera con usuario y salir -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📦 Control de Stock en Tiempo Real</h1>
            <div class="flex items-center space-x-4">
                <span id="userDisplay" class="text-xs font-semibold bg-gray-100 px-3 py-1.5 rounded-full text-gray-700"></span>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded transition">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Formulario para añadir productos -->
        <form id="productForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia</label>
                <input type="text" id="ref" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. REF-001">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
                <input type="text" id="nombre" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Taladro Percutor">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="md:col-span-4 text-right">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded text-sm transition">Añadir Producto</button>
            </div>
        </form>

        <!-- Pestañas o secciones -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Tabla de Inventario (2 columnas) -->
            <div class="lg:col-span-2 overflow-x-auto">
                <h2 class="text-lg font-bold text-gray-700 mb-3">Listado de Artículos</h2>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3">Referencia</th>
                            <th class="py-3 px-3">Producto</th>
                            <th class="py-3 px-3 text-center">Stock</th>
                            <th class="py-3 px-3 text-center">Movimiento</th>
                            <th class="py-3 px-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <tr><td colspan="5" class="text-center py-4 text-gray-400">Cargando productos...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Apartado de Registro / Historial (Quién hizo qué) -->
            <div class="bg-gray-50 p-4 rounded-lg border">
                <h2 class="text-lg font-bold text-gray-700 mb-3">📋 Registro de Actividad</h2>
                <div id="logsContainer" class="space-y-3 max-h-96 overflow-y-auto text-xs text-gray-600">
                    <p class="text-gray-400 text-center py-4">Cargando historial...</p>
                </div>
            </div>
        </div>
    </div>
