<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Papa Johns Empresarial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#16a34a',
                            600: '#15803d',
                            700: '#0f6635',
                            800: '#0a6f2c',
                            900: '#064e1f',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(22, 163, 74, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(22, 163, 74, 0.5); }
    </style>
</head>
<body class="bg-gradient-to-br from-brand-50 to-emerald-100 text-slate-800 dark:from-slate-900 dark:to-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Banner -->
    <header class="w-full bg-brand-800 border-b-4 border-brand-700 py-4 px-6 text-center shadow-lg relative z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between">
            <div class="text-left">
                <h2 class="text-2xl font-black text-white tracking-tight">PAPAJOHNS</h2>
                <p class="text-xs font-semibold text-emerald-200 tracking-wider uppercase">Mejores Ingredientes. Mejor Pizza.</p>
            </div>
            <div class="mt-3 sm:mt-0 flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="bg-brand-900/60 hover:bg-brand-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-brand-600">
                    <span id="darkModeIcon">🌙</span> Modo Oscuro
                </button>
            </div>
        </div>
    </header>

    <!-- LOGIN CONTAINER -->
    <main id="loginContainer" class="min-h-[calc(100vh-90px)] flex items-center justify-center p-4 relative z-10">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-8 sm:p-10 shadow-2
