<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock Sincronizada con Auditoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6">

    <!-- CONTENEDOR DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="authContainer" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-12">
        <h2 id="authTitle" class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 Iniciar Sesión</h2>
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
                <input type="email" id="authEmail" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                <input type="password" id="authPassword" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <button type="submit" id="authButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition">Entrar</button>
        </form>
        <p class="text-center text-xs text-blue-600 mt-4 cursor-pointer hover:underline font-semibold" id="toggleAuthMode">¿No tienes cuenta? Regístrate aquí</p>
        <p id="authError" class="text-center text-xs text-red-600 mt-2 font-semibold"></p>
    </div>

    <!-- APLICACIÓN PRINCIPAL DE STOCK (Oculta hasta iniciar sesión) -->
    <div id="appContainer" class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 hidden">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800">📦 Control de Stock en Tiempo Real</h1>
            <div class="flex items-center space-x-3">
                <span id="userDisplay" class="text-xs font-semibold bg-gray-100 px-3 py-1.5 rounded-full text-gray-700 truncate max-w-[150px] md:max-w-xs"></span>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded transition">Salir</button>
            </div>
        </div>

        <!-- Formulario para añadir productos -->
        <form id="productForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia</label>
                <input type="text" id="ref" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. REF-001">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
                <input type="text" id="nombre" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Taladro Percutor">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="md:col-span-4 text-right">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded text-sm transition">Añadir Producto</button>
            </div>
        </form>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Tabla de Inventario -->
            <div class="lg:col-span-2 overflow-x-auto">
                <h2 class="text-lg font-bold text-gray-700 mb-3">Listado de Artículos</h2>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3">Referencia</th>
                            <th class="py-3 px-3">Producto</th>
                            <th class="py-3 px-3 text-center">Stock</th>
                            <th class="py-3 px-3 text-center">Movimiento</th>
                            <th class="py-3 px-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <tr><td colspan="5" class="text-center py-4 text-gray-400">Cargando productos...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Apartado de Registro / Historial (Logs) -->
            <div class="bg-gray-50 p-4 rounded-lg border">
                <h2 class="text-lg font-bold text-gray-700 mb-3">📋 Registro de Actividad</h2>
                <div id="logsContainer" class="space-y-3 max-h-96 overflow-y-auto text-xs text-gray-600">
                    <p class="text-gray-400 text-center py-4">Cargando historial...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Firebase y lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwWhut9ALZuP5skWRT6RIBUR7hcf408Ks",
            authDomain: "gestion-de-stock-ab0fe.firebaseapp.com",
            projectId: "gestion-de-stock-ab0fe",
            storageBucket: "gestion-de-stock-ab0fe.appspot.com",
            messagingSenderId: "45302180887",
            appId: "1:45302180887:web:12d0f6fe21eed0e5dc052",
            measurementId: "G-YRBRV377PP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authContainer = document.getElementById('authContainer');
        const appContainer = document.getElementById('appContainer');
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authButton = document.getElementById('authButton');
        const toggleAuthMode = document.getElementById('toggleAuthMode');
        const authError = document.getElementById('authError');
        const userDisplay = document.getElementById('userDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const inventoryTable = document.getElementById('inventoryTable');
        const logsContainer = document.getElementById('logsContainer');

        let isRegistering = false;

        toggleAuthMode.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authTitle.textContent = isRegistering ? "📝 Registrarse" : "🔐 Iniciar Sesión";
            authButton.textContent = isRegistering ? "Registrarse" : "Entrar";
            toggleAuthMode.textContent = isRegistering ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí";
            authError.textContent = "";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            authError.textContent = "";

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                authError.textContent = "Error: " + error.message;
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userDisplay.textContent = user.email;
                iniciarApp();
            } else {
                appContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
            }
        });

        async function registrarLog(userEmail, accion) {
            try {
                await addDoc(collection(db, "historial"), {
                    usuario: userEmail,
                    detalle: accion,
                    fecha: serverTimestamp()
                });
            } catch (e) {
                console.error("Error al guardar historial: ", e);
            }
        }

        function iniciarApp() {
            const form = document.getElementById('productForm');

            form.onsubmit = async (e) => {
                e.preventDefault();
                const referencia = document.getElementById('ref').value;
                const nombre = document.getElementById('nombre').value;
                const stock = parseInt(document.getElementById('stock').value);
                const userEmail = auth.currentUser.email;

                try {
                    await addDoc(collection(db, "inventario"), { referencia, nombre, stock });
                    await registrarLog(userEmail, `Añadió '${nombre}' (${referencia}) con stock ${stock}`);
                    form.reset();
                } catch (error) {
                    alert("Error: " + error.message);
                }
            };

            window.cambiarStock = async function(id, nombreProd, stockActual, cantidad) {
                const nuevoStock = stockActual + cantidad;
                if (nuevoStock < 0) return;
                const userEmail = auth.currentUser.email;
                const tipo = cantidad > 0 ? `Entrada (+${cantidad})` : `Salida (${cantidad})`;

                try {
                    await updateDoc(doc(db, "inventario", id), { stock: nuevoStock });
                    await registrarLog(userEmail, `Hizo ${tipo} en '${nombreProd}'. Stock final: ${nuevoStock}`);
                } catch (error) {
                    console.error("Error al actualizar: ", error);
                }
            }

            window.eliminarProducto = async function(id, nombreProd) {
                if (confirm(`¿Eliminar '${nombreProd}'?`)) {
                    const userEmail = auth.currentUser.email;
                    try {
                        await deleteDoc(doc(db, "inventario", id));
                        await registrarLog(userEmail, `Eliminó el producto '${nombreProd}'`);
                    } catch (error) {
                        console.error("Error al eliminar: ", error);
                    }
                }
            }

            onSnapshot(collection(db, "inventario"), (snapshot) => {
                inventoryTable.innerHTML = "";
                if (snapshot.empty) {
                    inventoryTable.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">No hay productos registrados.</td></tr>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const id = docSnap.id;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="py-3 px-3 font-medium">${prod.referencia}</td>
                        <td class="py-3 px-3">${prod.nombre}</td>
                        <td class="py-3 px-3 text-center font-bold text-lg text-blue-600">${prod.stock}</td>
                        <td class="py-3 px-3 text-center space-x-1">
                            <button onclick="cambiarStock('${id}', '${prod.nombre}', ${prod.stock}, -1)" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded font-bold shadow">-</button>
                            <button onclick="cambiarStock('${id}', '${prod.nombre}', ${prod.stock}, 1)" class="bg-green-500 hover:bg-green-600 text-white px-2.5 py-1 rounded font-bold shadow">+</button>
                        </td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="eliminarProducto('${id}', '${prod.nombre}')" class="text-red-500 hover:text-red-700 text-xs font-semibold border border-red-200 px-2 py-1 rounded">Eliminar</button>
                        </td>
                    `;
                    inventoryTable.appendChild(tr);
                });
            });

            const q = query(collection(db, "historial"), orderBy("fecha", "desc"), limit(15));
            onSnapshot(q, (snapshot) => {
                logsContainer.innerHTML = "";
                if (snapshot.empty) {
                    logsContainer.innerHTML = `<p class="text-gray-400 text-center py-2">Sin actividad reciente.</p>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const log = docSnap.data();
                    const div = document.createElement('div');
                    div.className = "bg-white p-2.5 rounded border shadow-sm";
                    
                    let fechaStr = "Hace un momento";
                    if (log.fecha && log.fecha.toDate) {
                        fechaStr = log.fecha.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }

                    div.innerHTML = `
                        <div class="flex justify-between text-gray-400 text-[10px] mb-1">
                            <span class="font-bold text-blue-600">${log.usuario}</span>
                            <span>${fechaStr}</span>
                        </div>
                        <p class="text-gray-700">${log.detalle}</p>
                    `;
                    logsContainer.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
