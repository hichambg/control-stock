<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock Sincronizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📦 Control de Stock en Tiempo Real</h1>

        <!-- Formulario para añadir productos -->
        <form id="productForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia</label>
                <input type="text" id="ref" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. REF-001">
            </div>
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
                <input type="text" id="nombre" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Taladro Percutor">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="md:col-span-4 text-right">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded text-sm transition">Añadir Producto</button>
            </div>
        </form>

        <!-- Tabla de Inventario -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-xs uppercase tracking-wider">
                        <th class="py-3 px-4">Referencia</th>
                        <th class="py-3 px-4">Producto</th>
                        <th class="py-3 px-4 text-center">Stock Actual</th>
                        <th class="py-3 px-4 text-center">Entrada / Salida</th>
                        <th class="py-3 px-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable" class="divide-y divide-gray-200 text-sm text-gray-700">
                    <!-- Los productos se cargarán dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Firebase y lógica de la app -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBwWhut9ALZuP5skWRT6RIBUR7hcf408Ks",
            authDomain: "gestion-de-stock-ab0fe.firebaseapp.com",
            projectId: "gestion-de-stock-ab0fe",
            storageBucket: "gestion-de-stock-ab0fe.appspot.com",
            messagingSenderId: "45302180887",
            appId: "1:45302180887:web:12d0f6fe21eed0e5dc052",
            measurementId: "G-YRBRV377PP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('productForm');
        const inventoryTable = document.getElementById('inventoryTable');

        // Añadir producto a Firestore
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const referencia = document.getElementById('ref').value;
            const nombre = document.getElementById('nombre').value;
            const stock = parseInt(document.getElementById('stock').value);

            try {
                await addDoc(collection(db, "inventario"), {
                    referencia,
                    nombre,
                    stock
                });
                form.reset();
            } catch (error) {
                console.error("Error al añadir producto: ", error);
            }
        });

        // Modificar stock (Sumar o Restar)
        window.cambiarStock = async function(id, stockActual, cantidad) {
            const nuevoStock = stockActual + cantidad;
            if (nuevoStock < 0) return; // Evitar stock negativo
            try {
                const docRef = doc(db, "inventario", id);
                await updateDoc(docRef, { stock: nuevoStock });
            } catch (error) {
                console.error("Error al actualizar stock: ", error);
            }
        }

        // Eliminar producto
        window.eliminarProducto = async function(id) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                try {
                    await deleteDoc(doc(db, "inventario", id));
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                }
            }
        }

        // Suscripción en tiempo real a Firestore (se actualiza para todos)
        onSnapshot(collection(db, "inventario"), (snapshot) => {
            inventoryTable.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const prod = docSnap.data();
                const id = docSnap.id;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium">${prod.referencia}</td>
                    <td class="py-3 px-4">${prod.nombre}</td>
                    <td class="py-3 px-4 text-center font-bold text-lg text-blue-600">${prod.stock}</td>
                    <td class="py-3 px-4 text-center space-x-2">
                        <button onclick="cambiarStock('${id}', ${prod.stock}, -1)" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded font-bold shadow">-</button>
                        <button onclick="cambiarStock('${id}', ${prod.stock}, 1)" class="bg-green-500 hover:bg-green-600 text-white px-2.5 py-1 rounded font-bold shadow">+</button>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="eliminarProducto('${id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold border border-red-200 px-2.5 py-1 rounded">Eliminar</button>
                    </td>
                `;
                inventoryTable.appendChild(tr);
            });
        });
    </script>
</body>
</html>
