<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Gestión Empresarial</title>
    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #0f6635;
            --primary-light: #16a34a;
            --bg: #f0fdf4;
            --bg-secondary: #ecfdf5;
            --panel: #ffffff;
            --panel-soft: #f8fbf9;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #d1f5e3;
            --shadow-sm: 0 2px 8px rgba(21, 128, 61, 0.08);
            --shadow-md: 0 12px 35px rgba(21, 128, 61, 0.12);
            --shadow-lg: 0 24px 60px rgba(21, 128, 61, 0.18);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg) 100%);
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(22, 163, 74, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(21, 128, 61, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .brand-banner {
            width: 100%;
            background: linear-gradient(90deg, #0a6f2c 0%, #0d7a32 25%, #0c6829 100%);
            border-bottom: 4px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px rgba(9, 92, 38, 0.18);
        }

        .brand-banner-inner {
            max-width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            text-align: center;
        }

        .brand-banner-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .brand-banner-text strong {
            display: block;
            font-size: clamp(2rem, 4vw, 4rem);
            font-weight: 900;
            line-height: 0.9;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.12);
        }

        .brand-banner-text span {
            display: block;
            font-size: clamp(0.72rem, 1vw, 0.9rem);
            font-weight: 700;
            opacity: 0.95;
            letter-spacing: 0.08em;
        }

        /* LOGIN */
        #loginContainer {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(21, 128, 61, 0.1);
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #fff;
            color: var(--text);
        }

        input:hover, select:hover, textarea:hover {
            border-color: rgba(21, 128, 61, 0.3);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 8px rgba(22, 163, 74, 0.08);
            background: #fafffe;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(21, 128, 61, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(21, 128, 61, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--text-muted);
            box-shadow: 0 8px 20px rgba(100, 116, 139, 0.15);
        }

        .btn-secondary:hover {
            background: #475569;
            box-shadow: 0 12px 30px rgba(100, 116, 139, 0.25);
        }

        .btn-danger {
            background: #ef4444;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
        }

        #loginError {
            color: #dc2626;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }

        /* APP */
        #appContainer {
            min-height: calc(100vh - 90px);
            padding: 30px 20px;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.1) 0%, rgba(21, 128, 61, 0.05) 100%);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 999px;
            border: 2px solid rgba(21, 128, 61, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-change {
            background: none;
            color: #dc2626;
            border: 2px solid #fca5a5;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .btn-change:hover {
            background: rgba(239, 68, 68, 0.05);
            border-color: #ef4444;
        }

        .form-section {
            background: var(--panel);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(21, 128, 61, 0.08);
        }

        .form-section h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        thead tr {
            background: linear-gradient(90deg, var(--panel-soft) 0%, var(--bg) 100%);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 16px 14px;
            text-align: left;
            font-size: 11px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }

        tbody tr:hover {
            background: var(--panel-soft);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .stock-value {
            font-weight: 900;
            font-size: 18px;
            color: var(--primary-light);
        }

        .log-container {
            background: var(--panel);
            border-radius: 18px;
            padding: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(21, 128, 61, 0.08);
        }

        .log-container h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .log-box {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .log-box::-webkit-scrollbar {
            width: 6px;
        }

        .log-box::-webkit-scrollbar-track {
            background: var(--panel-soft);
            border-radius: 10px;
        }

        .log-box::-webkit-scrollbar-thumb {
            background: rgba(21, 128, 61, 0.3);
            border-radius: 10px;
        }

        .log-box::-webkit-scrollbar-thumb:hover {
            background: rgba(21, 128, 61, 0.5);
        }

        .log-item {
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.04) 0%, rgba(21, 128, 61, 0.02) 100%);
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-light);
            font-size: 13px;
            line-height: 1.5;
        }

        .log-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-user {
            font-weight: 800;
            color: var(--primary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .log-time {
            color: var(--text-muted);
            font-size: 11px;
        }

        .log-detail {
            color: var(--text);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--panel);
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(21, 128, 61, 0.12);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 28px;
        }

        .modal-buttons button {
            width: auto;
            padding: 12px 24px;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 40px 30px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-buttons {
                flex-direction: column-reverse;
            }

            .modal-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="brand-banner">
        <div class="brand-banner-inner">
            <div class="brand-banner-text">
                <strong>PAPAJOHNS</strong>
                <span>Mejores Ingredientes. Mejor Pizza.</span>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="loginContainer" class="container">
        <div class="login-card">
            <div class="login-header">
                <h1>📦 Control Stock</h1>
                <p>Gestión Empresarial de Inventario</p>
            </div>
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="nombreUsuario" placeholder="Ingresa tu nombre">
            </div>
            <button onclick="iniciarSesion()">Acceder</button>
            <p id="loginError"></p>
        </div>
    </div>

    <!-- APP -->
    <div id="appContainer" class="container hidden">
        <div class="app-wrapper">
            <div class="header">
                <h1>📦 Control de Stock</h1>
                <div class="user-info">
                    <div class="user-badge" id="userDisplay">👤 Usuario</div>
                    <button class="btn-change" onclick="cambiarUsuario()">Cambiar</button>
                </div>
            </div>

            <div class="form-section">
                <h3>Añadir Producto</h3>
                <form id="productForm" class="form-grid">
                    <div>
                        <label>Referencia</label>
                        <input type="text" id="ref" required placeholder="REF-001">
                    </div>
                    <div>
                        <label>Nombre del Producto</label>
                        <input type="text" id="nombre" required placeholder="Nombre del producto">
                    </div>
                    <div>
                        <label>Stock Inicial</label>
                        <input type="number" id="stock" required min="0" value="0">
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button type="submit" style="margin: 0;">Añadir</button>
                    </div>
                </form>
            </div>

            <div class="main-grid">
                <div class="form-section">
                    <h3>Listado de Artículos</h3>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Referencia</th>
                                    <th>Producto</th>
                                    <th style="text-align: center;">Stock</th>
                                    <th style="text-align: center;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTable">
                                <tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">Cargando productos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="log-container">
                    <h3>📋 Actividad</h3>
                    <div class="log-box" id="logsContainer">
                        <p style="text-align: center; color: var(--text-muted); padding: 20px 0;">Sin actividad reciente.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="comentarioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">📝 Registrar Salida</div>
            <p class="modal-subtitle">Producto: <strong id="modalProductName"></strong></p>

            <div class="form-group">
                <label>Motivo del Descuento</label>
                <textarea id="comentarioDescuento" placeholder="Explica por qué se descuenta stock..."></textarea>
            </div>

            <div class="form-group">
                <label>Tienda Destino</label>
                <select id="tiendaDestino">
                    <option value="">Selecciona una tienda</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-success" onclick="confirmarDescuento()">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwWhut9ALZuP5skWRT6RIBUR7hcf408Ks",
            authDomain: "gestion-de-stock-ab0fe.firebaseapp.com",
            databaseURL: "https://gestion-de-stock-ab0fe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gestion-de-stock-ab0fe",
            storageBucket: "gestion-de-stock-ab0fe.appspot.com",
            messagingSenderId: "45302180887",
            appId: "1:45302180887:web:12d0f6fe21eed0e5dc052",
            measurementId: "G-YRBRV377PP"
        };

        const tiendas = [
            "SERRANO", "PRINCIPE", "PESETA", "SILVANO", "SANSE", "ALBUFERA", "SANCHINARRO", "VALLEJO",
            "GETAFE EL BERCIAL", "ALCORCON NORTE", "MOSTOLES NORTE", "ANTRACITA", "SUECIA", "TORREJON",
            "GALILEO", "LEGANES", "FUENLABRADA", "ALCALA JOSE MARIA PEREDA", "TOLEDO", "VILLALBA",
            "GETAFE LOS MOLINOS", "PALACIO", "LAS ROZAS", "CUENCA", "TELESFORO", "VALLADOLID RECOLETOS",
            "SABADELL", "DIAGONAL", "ZARAGOZA DELICIAS", "ALCOBENDAS", "ZARAGOZA CASCO ANTIGUO",
            "GENERAL RICARDOS", "LOS YEBENES", "LEON", "BURGOS", "ALCALA LOPE DE FIGUEROA", "GIJON ESTE",
            "MARQUES DE VIANA", "BILBAO", "ORCASITAS", "TARRASA", "VALDEMORO", "VALDERREBOLLO", "SICILIA",
            "GIJON SUR", "POZUELO", "SALAMANCA", "CERRO MINGUETE", "CORTES CATALANAS", "ALCORCON SUR",
            "ISABEL COLBRAND", "MOSTOLES SUR", "BADALONA", "MAJADAHONDA", "ZARAGOZA LA JOTA", "DIAMANTE",
            "PERIS & VALERO", "FABRA", "PARIS", "ARTURO SORIA", "REINA VICTORIA", "HOSPITALET", "COSLADA",
            "PESET", "MUNTANER", "SARRIÀ", "BLASCO IBÁÑEZ", "USERA", "TRES FORQUES", "CORNELLA", "RIVAS",
            "PARLA CENTRO", "SANT ADRIÀ", "TOMARES", "REPUBLICA ARGENTINA", "MORATALAZ", "SEVILLA ESTE",
            "DOS HERMANAS", "SAN CIPRIANO", "VALLECAS DK", "GUADALAJARA", "Oviedo General Elorza",
            "Zaragoza Las Fuentes", "Sevilla Nervión", "BILBAO ABANDO", "SANTANDER CAZOÑA", "Tres Cantos",
            "Torrevieja", "Santander Puerto", "Aguadulce", "Benidorm", "Molins de Rei", "Logroño", "Vitoria",
            "Foodtruck3", "Massanassa", "Donosti"
        ];

        let db, loginContainer, appContainer, userDisplay, inventoryTable, logsContainer, comentarioModal, tiendaSelect;
        let usuarioActual = localStorage.getItem('stock_user') || '';
        let descuentoPendiente = null;

        function init() {
            loginContainer = document.getElementById('loginContainer');
            appContainer = document.getElementById('appContainer');
            userDisplay = document.getElementById('userDisplay');
            inventoryTable = document.getElementById('inventoryTable');
            logsContainer = document.getElementById('logsContainer');
            comentarioModal = document.getElementById('comentarioModal');
            tiendaSelect = document.getElementById('tiendaDestino');

            try {
                const app = initializeApp(firebaseConfig);
                db = getDatabase(app);
            } catch (err) {
                console.error("Error Firebase:", err);
                document.getElementById('loginError').textContent = "Error de conexión.";
            }

            if (usuarioActual && db) mostrarApp();
        }

        window.iniciarSesion = function() {
            const nombre = document.getElementById('nombreUsuario').value.trim();
            if (!nombre) {
                alert("Por favor, introduce tu nombre.");
                return;
            }
            usuarioActual = nombre;
            localStorage.setItem('stock_user', nombre);
            mostrarApp();
        }

        window.cambiarUsuario = function() {
            localStorage.removeItem('stock_user');
            location.reload();
        }

        function mostrarApp() {
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            userDisplay.textContent = `👤 ${usuarioActual}`;
            cargarTiendas();
            iniciarLogica();
        }

        function cargarTiendas() {
            tiendaSelect.innerHTML = '<option value="">Selecciona una tienda</option>' +
                tiendas.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function registrarLog(accion, comentario = '') {
            if (!db) return;
            try {
                const logsRef = ref(db, 'historial');
                const nuevoLogRef = push(logsRef);
                let detalle = accion;
                if (comentario) detalle += ` | ${comentario}`;
                set(nuevoLogRef, {
                    usuario: usuarioActual,
                    detalle: detalle,
                    fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });
            } catch (e) {
                console.error("Error historial:", e);
            }
        }

        window.abrirModalDescuento = function(id, nombreProd, stockActual) {
            descuentoPendiente = { id, nombreProd, stockActual };
            document.getElementById('modalProductName').textContent = nombreProd;
            document.getElementById('comentarioDescuento').value = '';
            tiendaSelect.value = '';
            comentarioModal.classList.add('show');
        }

        window.cerrarModal = function() {
            comentarioModal.classList.remove('show');
            descuentoPendiente = null;
        }

        window.confirmarDescuento = function() {
            const comentario = document.getElementById('comentarioDescuento').value.trim();
            const tienda = tiendaSelect.value.trim();

            if (!comentario) {
                alert("Indica el motivo del descuento.");
                return;
            }
            if (!tienda) {
                alert("Selecciona la tienda destino.");
                return;
            }
            if (!descuentoPendiente) return;

            const { id, nombreProd, stockActual } = descuentoPendiente;
            const nuevoStock = stockActual - 1;

            try {
                const prodRef = ref(db, 'inventario/' + id);
                update(prodRef, { stock: nuevoStock });
                registrarLog(`Salida (-1) en '${nombreProd}'. Stock: ${nuevoStock}. Tienda: ${tienda}.`, comentario);
                cerrarModal();
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function iniciarLogica() {
            const form = document.getElementById('productForm');

            form.onsubmit = (e) => {
                e.preventDefault();
                const referencia = document.getElementById('ref').value;
                const nombre = document.getElementById('nombre').value;
                const stock = parseInt(document.getElementById('stock').value);

                try {
                    const inventarioRef = ref(db, 'inventario');
                    const nuevoProdRef = push(inventarioRef);
                    set(nuevoProdRef, { referencia, nombre, stock });
                    registrarLog(`Añadió '${nombre}' (${referencia}) con stock ${stock}`);
                    form.reset();
                } catch (error) {
                    alert("Error al añadir: " + error.message);
                }
            };

            window.cambiarStock = function(id, nombreProd, stockActual, cantidad) {
                const nuevoStock = stockActual + cantidad;
                if (nuevoStock < 0) return;

                if (cantidad < 0) {
                    abrirModalDescuento(id, nombreProd, stockActual);
                    return;
                }

                try {
                    const prodRef = ref(db, 'inventario/' + id);
                    update(prodRef, { stock: nuevoStock });
                    registrarLog(`Entrada (+${cantidad}) en '${nombreProd}'. Stock: ${nuevoStock}`);
                } catch (error) {
                    console.error("Error:", error);
                }
            }

            window.eliminarProducto = function(id, nombreProd) {
                if (confirm(`¿Eliminar '${nombreProd}'?`)) {
                    try {
                        const prodRef = ref(db, 'inventario/' + id);
                        remove(prodRef);
                        registrarLog(`Eliminó '${nombreProd}'`);
                    } catch (error) {
                        console.error("Error:", error);
                    }
                }
            }

            const inventarioRef = ref(db, 'inventario');
            onValue(inventarioRef, (snapshot) => {
                inventoryTable.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    inventoryTable.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">Sin productos registrados.</td></tr>`;
                    return;
                }
                Object.keys(data).forEach((id) => {
                    const prod = data[id];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${prod.referencia}</td>
                        <td>${prod.nombre}</td>
                        <td style="text-align: center;"><span class="stock-value">${prod.stock}</span></td>
                        <td style="text-align: center;">
                            <button onclick="cambiarStock('${id}', '${prod.nombre.replace(/'/g, "\\'")}', ${prod.stock}, -1)" class="btn-danger" style="width: auto; padding: 8px 12px; margin-right: 8px;">-1</button>
                            <button onclick="cambiarStock('${id}', '${prod.nombre.replace(/'/g, "\\'")}', ${prod.stock}, 1)" class="btn-success" style="width: auto; padding: 8px 12px; margin-right: 8px;">+1</button>
                            <button onclick="eliminarProducto('${id}', '${prod.nombre.replace(/'/g, "\\'")}')" style="background: none; color: #dc2626; border: 2px solid #fca5a5; padding: 8px 12px; border-radius: 8px; width: auto;">Eliminar</button>
                        </td>
                    `;
                    inventoryTable.appendChild(tr);
                });
            });

            const logsRef = ref(db, 'historial');
            onValue(logsRef, (snapshot) => {
                logsContainer.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    logsContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px 0;">Sin actividad.</p>`;
                    return;
                }
                const logsArray = Object.values(data).reverse().slice(0, 20);
                logsArray.forEach((log) => {
                    const div = document.createElement('div');
                    div.className = "log-item";
                    div.innerHTML = `
                        <div class="log-item-header">
                            <span class="log-user">${log.usuario}</span>
                            <span class="log-time">${log.fecha}</span>
                        </div>
                        <div class="log-detail">${log.detalle}</div>
                    `;
                    logsContainer.appendChild(div);
                });
            });
        }

        init();
    </script>
</body>
</html>
