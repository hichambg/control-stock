<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Papa Johns Empresarial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#16a34a',
                            600: '#15803d',
                            700: '#0f6635',
                            800: '#0a6f2c',
                            900: '#064e1f',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(22, 163, 74, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(22, 163, 74, 0.5); }
    </style>
</head>
<body class="bg-gradient-to-br from-brand-50 to-emerald-100 text-slate-800 dark:from-slate-900 dark:to-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Banner -->
    <header class="w-full bg-brand-800 border-b-4 border-brand-700 py-4 px-6 text-center shadow-lg relative z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between">
            <div class="text-left">
                <h2 class="text-2xl font-black text-white tracking-tight">PAPAJOHNS</h2>
                <p class="text-xs font-semibold text-emerald-200 tracking-wider uppercase">Mejores Ingredientes. Mejor Pizza.</p>
            </div>
            <div class="mt-3 sm:mt-0 flex items-center gap-3">
                <button id="darkModeBtn" class="bg-brand-900/60 hover:bg-brand-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-brand-600">
                    <span id="darkModeIcon">🌙</span> Modo Oscuro
                </button>
            </div>
        </div>
    </header>

    <!-- LOGIN CONTAINER -->
    <main id="loginContainer" class="min-h-[calc(100vh-90px)] flex items-center justify-center p-4 relative z-10">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-8 sm:p-10 shadow-2xl border border-brand-500/10 backdrop-blur-xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">📦</div>
                <h1 class="text-2xl font-black text-brand-600 dark:text-brand-400 tracking-tight">Control Stock</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 font-medium">Gestión Empresarial de Inventario</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-brand-700 dark:text-brand-400 uppercase tracking-wider mb-2">Usuario</label>
                    <input type="text" id="nombreUsuario" placeholder="Introduce tu usuario" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none transition font-medium text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-brand-700 dark:text-brand-400 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="passwordUsuario" placeholder="••••••••••••" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none transition font-medium text-sm">
                </div>
                <div id="nombrePersonalContainer" class="hidden">
                    <label class="block text-xs font-bold text-brand-700 dark:text-brand-400 uppercase tracking-wider mb-2">Tu Nombre (Técnico)</label>
                    <input type="text" id="nombrePersonal" placeholder="Escribe tu nombre completo" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none transition font-medium text-sm">
                </div>
                <button id="btnLogin" class="w-full py-3.5 bg-gradient-to-r from-brand-500 to-brand-700 hover:from-brand-600 hover:to-brand-800 text-white font-bold rounded-xl shadow-lg shadow-brand-500/25 transition transform active:scale-95 uppercase tracking-wider text-sm cursor-pointer">
                    Acceder al Sistema
                </button>
                <p id="loginError" class="text-red-500 text-xs text-center font-medium mt-2"></p>
            </div>
        </div>
    </main>

    <!-- APP CONTAINER -->
    <div id="appContainer" class="hidden min-h-[calc(100vh-90px)] p-4 sm:p-8 relative z-10">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- Top App Bar -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl border border-brand-500/10 gap-4">
                <div>
                    <h1 class="text-3xl font-black text-brand-700 dark:text-brand-400 tracking-tight flex items-center gap-2">
                        <span>📦</span> Panel de Control
                    </h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">Control de inventario en tiempo real sincronizado</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="inline-flex items-center gap-2 bg-emerald-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-4 py-2 rounded-full border-2 border-brand-500/20 font-extrabold text-xs uppercase tracking-wider">
                        <span id="userDisplay">👤 Usuario</span>
                    </div>
                    <button id="btnChangeUser" class="text-red-600 hover:text-red-700 border-2 border-red-300 hover:border-red-500 px-3 py-1.5 rounded-xl text-xs font-bold transition uppercase tracking-wider cursor-pointer">
                        Cambiar
                    </button>
                    <button id="btnExport" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition uppercase tracking-wider shadow-md flex items-center gap-1.5 cursor-pointer">
                        📥 Descargar Excel
                    </button>
                </div>
            </div>

            <!-- Stats Quick Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-lg border border-brand-500/10 flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold">📊</div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Artículos</p>
                        <h4 id="statTotalItems" class="text-2xl font-black text-slate-800 dark:text-slate-100">0</h4>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-lg border border-brand-500/10 flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 text-blue-600 rounded-xl flex items-
