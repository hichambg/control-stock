<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock en Tiempo Real</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        .max { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, button { padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        input { width: 100%; margin-bottom: 12px; }
        button { background-color: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        th { background-color: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn-red { background-color: #ef4444; padding: 5px 10px; }
        .btn-red:hover { background-color: #dc2626; }
        .btn-green { background-color: #10b981; padding: 5px 10px; }
        .btn-green:hover { background-color: #059669; }
        .log-box { background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; max-height: 350px; overflow-y: auto; font-size: 12px; }
        .log-item { background: white; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <!-- IDENTIFICACIÓN -->
    <div id="loginContainer" class="max" style="max-width: 400px; margin-top: 60px;">
        <h2 style="text-align: center; margin-bottom: 20px;">👤 Identifícate</h2>
        <div>
            <label style="font-size: 12px; font-weight: bold; color: #4b5563; display: block; margin-bottom: 5px;">Tu Nombre o Usuario</label>
            <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre">
            <button onclick="iniciarSesion()" style="width: 100%;">Acceder al Inventario</button>
            <p id="loginError" style="color: red; font-size: 12px; text-align: center; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appContainer" class="max hidden">
        <div class="flex" style="border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 20px;">
            <h1 style="font-size: 20px; margin: 0;">📦 Control de Stock</h1>
            <div>
                <span id="userDisplay" style="font-size: 12px; font-weight: bold; background: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 20px; border: 1px solid #bfdbfe; margin-right: 10px;"></span>
                <button onclick="cambiarUsuario()" style="background: none; color: #dc2626; text-decoration: underline; padding: 0; font-size: 12px;">Cambiar</button>
            </div>
        </div>

        <!-- Formulario de Productos -->
        <form id="productForm" class="grid">
            <div>
                <label style="font-size: 12px; font-weight: bold; color: #4b5563; display: block; margin-bottom: 5px;">Referencia</label>
                <input type="text" id="ref" required placeholder="REF-001" style="margin-bottom:0;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: bold; color: #4b5563; display: block; margin-bottom: 5px;">Nombre del Producto</label>
                <input type="text" id="nombre" required placeholder="Nombre del producto" style="margin-bottom:0;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: bold; color: #4b5563; display: block; margin-bottom: 5px;">Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" style="margin-bottom:0;">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button type="submit" style="width: 100%; height: 41px;">Añadir Producto</button>
            </div>
        </form>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <!-- Tabla de Inventario -->
            <div>
                <h3 style="margin-top: 0; font-size: 16px;">Listado de Artículos</h3>
                <div style="overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Producto</th>
                                <th style="text-align: center;">Stock</th>
                                <th style="text-align: center;">Movimiento</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable">
                            <tr><td colspan="5" style="text-align: center; color: #9ca3af;">Cargando productos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Registro de Actividad -->
            <div>
                <h3 style="margin-top: 0; font-size: 16px;">📋 Registro de Actividad</h3>
                <div id="logsContainer" class="log-box">
                    <p style="text-align: center; color: #9ca3af;">Cargando historial...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, initializeFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwWhut9ALZuP5skWRT6RIBUR7hcf408Ks",
            authDomain: "gestion-de-stock-ab0fe.firebaseapp.com",
            projectId: "gestion-de-stock-ab0fe",
            storageBucket: "gestion-de-stock-ab0fe.appspot.com",
            messagingSenderId: "45302180887",
            appId: "1:45302180887:web:12d0f6fe21eed0e5dc052",
            measurementId: "G-YRBRV377PP"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
        } catch (err) {
            console.error("Error al inicializar Firebase:", err);
            document.getElementById('loginError').textContent = "Error de conexión con Firebase.";
        }

        const loginContainer = document.getElementById('loginContainer');
        const appContainer = document.getElementById('appContainer');
        const userDisplay = document.getElementById('userDisplay');
        const inventoryTable = document.getElementById('inventoryTable');
        const logsContainer = document.getElementById('logsContainer');

        let usuarioActual = localStorage.getItem('stock_user') || '';

        if (usuarioActual && db) {
            mostrarApp();
        }

        window.iniciarSesion = function() {
            const nombre = document.getElementById('nombreUsuario').value.trim();
            if (!nombre) {
                alert("Por favor, introduce tu nombre.");
                return;
            }
            usuarioActual = nombre;
            localStorage.setItem('stock_user', nombre);
            mostrarApp();
        }

        window.cambiarUsuario = function() {
            localStorage.removeItem('stock_user');
            location.reload();
        }

        function mostrarApp() {
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            userDisplay.textContent = `👤 ${usuarioActual}`;
            iniciarLogica();
        }

        async function registrarLog(accion) {
            try {
                await addDoc(collection(db, "historial"), {
                    usuario: usuarioActual,
                    detalle: accion,
                    fecha: serverTimestamp()
                });
            } catch (e) {
                console.error("Error al guardar historial: ", e);
            }
        }

        function iniciarLogica() {
            const form = document.getElementById('productForm');

            form.onsubmit = async (e) => {
                e.preventDefault();
                const referencia = document.getElementById('ref').value;
                const nombre = document.getElementById('nombre').value;
                const stock = parseInt(document.getElementById('stock').value);

                try {
                    await addDoc(collection(db, "inventario"), { referencia, nombre, stock });
                    await registrarLog(`Añadió '${nombre}' (${referencia}) con stock ${stock}`);
                    form.reset();
                } catch (error) {
                    alert("Error al añadir: " + error.message);
                }
            };

            window.cambiarStock = async function(id, nombreProd, stockActual, cantidad) {
                const nuevoStock = stockActual + cantidad;
                if (nuevoStock < 0) return;
                const tipo = cantidad > 0 ? `Entrada (+${cantidad})` : `Salida (${cantidad})`;

                try {
                    await updateDoc(doc(db, "inventario", id), { stock: nuevoStock });
                    await registrarLog(`Hizo ${tipo} en '${nombreProd}'. Stock final: ${nuevoStock}`);
                } catch (error) {
                    console.error("Error al actualizar: ", error);
                }
            }

            window.eliminarProducto = async function(id, nombreProd) {
                if (confirm(`¿Eliminar '${nombreProd}'?`)) {
                    try {
                        await deleteDoc(doc(db, "inventario", id));
                        await registrarLog(`Eliminó el producto '${nombreProd}'`);
                    } catch (error) {
                        console.error("Error al eliminar: ", error);
                    }
                }
            }

            onSnapshot(collection(db, "inventario"), (snapshot) => {
                inventoryTable.innerHTML = "";
                if (snapshot.empty) {
                    inventoryTable.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af; padding: 15px;">No hay productos registrados.</td></tr>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const id = docSnap.id;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 500;">${prod.referencia}</td>
                        <td>${prod.nombre}</td>
                        <td style="text-align: center; font-weight: bold; font-size: 16px; color: #2563eb;">${prod.stock}</td>
                        <td style="text-align: center;">
                            <button onclick="cambiarStock('${id}', '${prod.nombre}', ${prod.stock}, -1)" class="btn-red">-</button>
                            <button onclick="cambiarStock('${id}', '${prod.nombre}', ${prod.stock}, 1)" class="btn-green">+</button>
                        </td>
                        <td style="text-align: center;">
                            <button onclick="eliminarProducto('${id}', '${prod.nombre}')" style="background: none; color: #ef4444; border: 1px solid #fca5a5; padding: 4px 8px; font-size: 12px;">Eliminar</button>
                        </td>
                    `;
                    inventoryTable.appendChild(tr);
                });
            });

            const q = query(collection(db, "historial"), orderBy("fecha", "desc"), limit(15));
            onSnapshot(q, (snapshot) => {
                logsContainer.innerHTML = "";
                if (snapshot.empty) {
                    logsContainer.innerHTML = `<p style="text-align: center; color: #9ca3af;">Sin actividad reciente.</p>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const log = docSnap.data();
                    const div = document.createElement('div');
                    div.className = "log-item";
                    
                    let fechaStr = "Hace un momento";
                    if (log.fecha && log.fecha.toDate) {
                        fechaStr = log.fecha.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }

                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; color: #9ca3af; font-size: 10px; margin-bottom: 4px;">
                            <span style="font-weight: bold; color: #2563eb;">${log.usuario}</span>
                            <span>${fechaStr}</span>
                        </div>
                        <div style="color: #374151;">${log.detalle}</div>
                    `;
                    logsContainer.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
