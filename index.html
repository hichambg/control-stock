<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock en Tiempo Real</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --panel: #ffffff;
            --panel-soft: #f7fdf8;
            --primary: #15803d;
            --primary-dark: #127a31;
            --primary-soft: #dcfce7;
            --success: #16a34a;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --muted: #64748b;
            --text: #0f172a;
            --border: #d1f5e3;
            --shadow: 0 12px 35px rgba(21, 128, 61, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 100%);
            margin: 0;
            padding: 28px 18px;
            color: var(--text);
        }

        .max {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel);
            padding: 28px 26px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(21, 128, 61, 0.16);
        }

        .hidden { display: none !important; }

        input, button, textarea, select {
            padding: 11px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input, select {
            width: 100%;
            margin-bottom: 12px;
            background: #fff;
            color: var(--text);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(21, 128, 61, 0.6);
            box-shadow: 0 0 0 4px rgba(21, 128, 61, 0.08);
        }

        textarea {
            width: 100%;
            resize: vertical;
            min-height: 90px;
            font-family: inherit;
            background: #fff;
            color: var(--text);
        }

        button {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 8px 18px rgba(21, 128, 61, 0.22);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(21, 128, 61, 0.26);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        th, td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }

        th {
            background: var(--panel-soft);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 800;
            border-color: var(--border);
        }

        tbody tr:hover {
            background: #f8fdf9;
        }

        .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            background: linear-gradient(180deg, #f7fdf8, #f0fef6);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 22px;
            border: 1px solid var(--border);
        }

        .btn-red {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            padding: 6px 12px;
            box-shadow: none;
        }

        .btn-red:hover {
            background: #dc2626;
        }

        .btn-green {
            background: linear-gradient(180deg, var(--success) 0%, var(--primary) 100%);
            padding: 6px 12px;
            box-shadow: none;
        }

        .btn-green:hover {
            background: var(--primary);
        }

        .log-box {
            background: linear-gradient(180deg, #f7fdf8 0%, #f0fef6 100%);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            max-height: 380px;
            overflow-y: auto;
            font-size: 12px;
        }

        .log-item {
            background: white;
            padding: 10px 11px;
            margin-bottom: 9px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.52);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            padding: 24px 22px;
            border-radius: 18px;
            box-shadow: 0 24px 50px rgba(21, 128, 61, 0.22);
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(21, 128, 61, 0.15);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 14px;
            color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-buttons button {
            width: auto;
            padding: 11px 20px;
        }

        .btn-cancel {
            background: linear-gradient(180deg, #64748b 0%, #475569 100%) !important;
            box-shadow: none !important;
        }

        .btn-cancel:hover {
            background: #475569 !important;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
        }

        #loginContainer {
            max-width: 440px;
            margin-top: 70px;
            padding: 34px 26px;
        }

        #loginContainer h2 {
            text-align: center;
            margin-bottom: 22px;
            font-size: 30px;
            color: var(--primary);
        }

        #userDisplay {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 800;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(21, 128, 61, 0.18);
        }

        #productForm button[type="submit"] {
            height: 44px;
            width: 100%;
        }

        @media (max-width: 760px) {
            body { padding: 18px 12px; }
            .max { padding: 18px 14px; }
            .flex { flex-direction: column; align-items: flex-start; }
            .modal-content { padding: 18px 16px; }
            .modal-buttons { flex-direction: column-reverse; }
            .modal-buttons button { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="loginContainer" class="max">
        <h2>👤 Identifícate</h2>
        <div>
            <label>Tu Nombre o Usuario</label>
            <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre">
            <button onclick="iniciarSesion()" style="width: 100%;">Acceder al Inventario</button>
            <p id="loginError" style="color: red; font-size: 12px; text-align: center; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="appContainer" class="max hidden">
        <div class="flex" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px;">
            <h1 style="font-size: 28px; margin: 0; font-weight: 800; color: var(--primary);">📦 Control de Stock</h1>
            <div>
                <span id="userDisplay">👤 Usuario</span>
                <button onclick="cambiarUsuario()" style="background: transparent; color: #dc2626; text-decoration: underline; padding: 0; font-size: 12px; box-shadow: none; margin-left: 10px;">Cambiar</button>
            </div>
        </div>

        <form id="productForm" class="grid">
            <div>
                <label>Referencia</label>
                <input type="text" id="ref" required placeholder="REF-001" style="margin-bottom:0;">
            </div>
            <div>
                <label>Nombre del Producto</label>
                <input type="text" id="nombre" required placeholder="Nombre del producto" style="margin-bottom:0;">
            </div>
            <div>
                <label>Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" style="margin-bottom:0;">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button type="submit">Añadir Producto</button>
            </div>
        </form>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 22px;">
            <div>
                <h3 style="margin-top: 0; font-size: 18px; font-weight: 800; color: var(--primary);">Listado de Artículos</h3>
                <div style="overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff;">
                    <table>
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Producto</th>
                                <th style="text-align: center;">Stock</th>
                                <th style="text-align: center;">Movimiento</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable">
                            <tr><td colspan="5" style="text-align: center; color: #9ca3af;">Cargando productos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <h3 style="margin-top: 0; font-size: 18px; font-weight: 800; color: var(--primary);">📋 Registro de Actividad</h3>
                <div id="logsContainer" class="log-box">
                    <p style="text-align: center; color: #9ca3af;">Sin actividad reciente.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="comentarioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">📝 Motivo del Descuento</div>
            <p style="color: #475569; margin-bottom: 15px;">Producto: <strong id="modalProductName"></strong></p>
            <label>¿Por qué se descuenta stock?</label>
            <textarea id="comentarioDescuento" placeholder="Ej: Producto dañado, pérdida en inventario, devolución del cliente..."></textarea>

            <label style="margin-top: 15px;">Tienda</label>
            <select id="tiendaDestino">
                <option value="">Selecciona una tienda</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button onclick="confirmarDescuento()">Confirmar Descuento</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwWhut9ALZuP5skWRT6RIBUR7hcf408Ks",
            authDomain: "gestion-de-stock-ab0fe.firebaseapp.com",
            databaseURL: "https://gestion-de-stock-ab0fe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gestion-de-stock-ab0fe",
            storageBucket: "gestion-de-stock-ab0fe.appspot.com",
            messagingSenderId: "45302180887",
            appId: "1:45302180887:web:12d0f6fe21eed0e5dc052",
            measurementId: "G-YRBRV377PP"
        };

        const tiendas = [
            "SERRANO",
            "PRINCIPE",
            "PESETA",
            "SILVANO",
            "SANSE",
            "ALBUFERA",
            "SANCHINARRO",
            "VALLEJO",
            "GETAFE EL BERCIAL",
            "ALCORCON NORTE",
            "MOSTOLES NORTE",
            "ANTRACITA",
            "SUECIA",
            "TORREJON",
            "GALILEO",
            "LEGANES",
            "FUENLABRADA",
            "ALCALA JOSE MARIA PEREDA",
            "TOLEDO",
            "VILLALBA",
            "GETAFE LOS MOLINOS",
            "PALACIO",
            "LAS ROZAS",
            "CUENCA",
            "TELESFORO",
            "VALLADOLID RECOLETOS",
            "SABADELL",
            "DIAGONAL",
            "ZARAGOZA DELICIAS",
            "ALCOBENDAS",
            "ZARAGOZA CASCO ANTIGUO",
            "GENERAL RICARDOS",
            "LOS YEBENES",
            "LEON",
            "BURGOS",
            "ALCALA LOPE DE FIGUEROA",
            "GIJON ESTE",
            "MARQUES DE VIANA",
            "BILBAO",
            "ORCASITAS",
            "TARRASA",
            "VALDEMORO",
            "VALDERREBOLLO",
            "SICILIA",
            "GIJON SUR",
            "POZUELO",
            "SALAMANCA",
            "CERRO MINGUETE",
            "CORTES CATALANAS",
            "ALCORCON SUR",
            "ISABEL COLBRAND",
            "MOSTOLES SUR",
            "BADALONA",
            "MAJADAHONDA",
            "ZARAGOZA LA JOTA",
            "DIAMANTE",
            "PERIS & VALERO",
            "FABRA",
            "PARIS",
            "ARTURO SORIA",
            "REINA VICTORIA",
            "HOSPITALET",
            "COSLADA",
            "PESET",
            "MUNTANER",
            "SARRIÀ",
            "BLASCO IBÁÑEZ",
            "USERA",
            "TRES FORQUES",
            "CORNELLA",
            "RIVAS",
            "PARLA CENTRO",
            "SANT ADRIÀ",
            "TOMARES",
            "REPUBLICA ARGENTINA",
            "MORATALAZ",
            "SEVILLA ESTE",
            "DOS HERMANAS",
            "SAN CIPRIANO",
            "VALLECAS DK",
            "GUADALAJARA",
            "Oviedo General Elorza",
            "Zaragoza Las Fuentes",
            "Sevilla Nervión",
            "BILBAO ABANDO",
            "SANTANDER CAZOÑA",
            "Tres Cantos",
            "Torrevieja",
            "Santander Puerto",
            "Aguadulce",
            "Benidorm",
            "Molins de Rei",
            "Logroño",
            "Vitoria",
            "Foodtruck3",
            "Massanassa",
            "Donosti"
        ];

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (err) {
            console.error("Error al inicializar Firebase:", err);
            document.getElementById('loginError').textContent = "Error de conexión con Firebase.";
        }

        const loginContainer = document.getElementById('loginContainer');
        const appContainer = document.getElementById('appContainer');
        const userDisplay = document.getElementById('userDisplay');
        const inventoryTable = document.getElementById('inventoryTable');
        const logsContainer = document.getElementById('logsContainer');
        const comentarioModal = document.getElementById('comentarioModal');
        const tiendaSelect = document.getElementById('tiendaDestino');

        let usuarioActual = localStorage.getItem('stock_user') || '';
        let descuentoPendiente = null;

        function cargarTiendas() {
            tiendaSelect.innerHTML = '<option value="">Selecciona una tienda</option>' +
                tiendas.map((tienda) => `<option value="${tienda}">${tienda}</option>`).join('');
        }

        if (usuarioActual && db) {
            mostrarApp();
        }

        window.iniciarSesion = function() {
            const nombre = document.getElementById('nombreUsuario').value.trim();
            if (!nombre) {
                alert("Por favor, introduce tu nombre.");
                return;
            }
            usuarioActual = nombre;
            localStorage.setItem('stock_user', nombre);
            mostrarApp();
        }

        window.cambiarUsuario = function() {
            localStorage.removeItem('stock_user');
            location.reload();
        }

        function mostrarApp() {
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            userDisplay.textContent = `👤 ${usuarioActual}`;
            cargarTiendas();
            iniciarLogica();
        }

        function registrarLog(accion, comentario = '') {
            try {
                const logsRef = ref(db, 'historial');
                const nuevoLogRef = push(logsRef);
                let detalle = accion;
                if (comentario) {
                    detalle += ` | Nota: ${comentario}`;
                }
                set(nuevoLogRef, {
                    usuario: usuarioActual,
                    detalle: detalle,
                    fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });
            } catch (e) {
                console.error("Error al guardar historial: ", e);
            }
        }

        window.abrirModalDescuento = function(id, nombreProd, stockActual) {
            descuentoPendiente = { id, nombreProd, stockActual };
            document.getElementById('modalProductName').textContent = nombreProd;
            document.getElementById('comentarioDescuento').value = '';
            tiendaSelect.value = '';
            comentarioModal.classList.add('show');
        }

        window.cerrarModal = function() {
            comentarioModal.classList.remove('show');
            descuentoPendiente = null;
        }

        window.confirmarDescuento = function() {
            const comentario = document.getElementById('comentarioDescuento').value.trim();
            const tienda = tiendaSelect.value.trim();

            if (!comentario) {
                alert("Por favor, indica el motivo del descuento.");
                return;
            }

            if (!tienda) {
                alert("Selecciona la tienda a la que va destinado este stock.");
                return;
            }

            if (!descuentoPendiente) return;

            const { id, nombreProd, stockActual } = descuentoPendiente;
            const nuevoStock = stockActual - 1;

            try {
                const prodRef = ref(db, 'inventario/' + id);
                update(prodRef, { stock: nuevoStock });
                registrarLog(`Salida (-1) en '${nombreProd}'. Stock final: ${nuevoStock}. Tienda: ${tienda}.`, comentario);
                cerrarModal();
            } catch (error) {
                console.error("Error al actualizar: ", error);
            }
        }

        function iniciarLogica() {
            const form = document.getElementById('productForm');

            form.onsubmit = (e) => {
                e.preventDefault();
                const referencia = document.getElementById('ref').value;
                const nombre = document.getElementById('nombre').value;
                const stock = parseInt(document.getElementById('stock').value);

                try {
                    const inventarioRef = ref(db, 'inventario');
                    const nuevoProdRef = push(inventarioRef);
                    set(nuevoProdRef, { referencia, nombre, stock });
                    registrarLog(`Añadió '${nombre}' (${referencia}) con stock ${stock}`);
                    form.reset();
                } catch (error) {
                    alert("Error al añadir: " + error.message);
                }
            };

            window.cambiarStock = function(id, nombreProd, stockActual, cantidad) {
                const nuevoStock = stockActual + cantidad;
                if (nuevoStock < 0) return;

                if (cantidad < 0) {
                    abrirModalDescuento(id, nombreProd, stockActual);
                    return;
                }

                const tipo = `Entrada (+${cantidad})`;
                try {
                    const prodRef = ref(db, 'inventario/' + id);
                    update(prodRef, { stock: nuevoStock });
                    registrarLog(`Hizo ${tipo} en '${nombreProd}'. Stock final: ${nuevoStock}`);
                } catch (error) {
                    console.error("Error al actualizar: ", error);
                }
            }

            window.eliminarProducto = function(id, nombreProd) {
                if (confirm(`¿Eliminar '${nombreProd}'?`)) {
                    try {
                        const prodRef = ref(db, 'inventario/' + id);
                        remove(prodRef);
                        registrarLog(`Eliminó el producto '${nombreProd}'`);
                    } catch (error) {
                        console.error("Error al eliminar: ", error);
                    }
                }
            }

            const inventarioRef = ref(db, 'inventario');
            onValue(inventarioRef, (snapshot) => {
                inventoryTable.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    inventoryTable.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af; padding: 15px;">No hay productos registrados.</td></tr>`;
                    return;
                }
                Object.keys(data).forEach((id) => {
                    const prod = data[id];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600;">${prod.referencia}</td>
                        <td>${prod.nombre}</td>
                        <td style="text-align: center; font-weight: 800; font-size: 16px; color: var(--primary);">${prod.stock}</td>
                        <td style="text-align: center;">
                            <button onclick="cambiarStock('${id}', '${prod.nombre.replace(/'/g, "\\'")}', ${prod.stock}, -1)" class="btn-red">-</button>
                            <button onclick="cambiarStock('${id}', '${prod.nombre.replace(/'/g, "\\'")}', ${prod.stock}, 1)" class="btn-green" style="margin-left: 6px;">+</button>
                        </td>
                        <td style="text-align: center;">
                            <button onclick="eliminarProducto('${id}', '${prod.nombre.replace(/'/g, "\\'")}')" style="background: none; color: #ef4444; border: 1px solid #fca5a5; padding: 7px 10px; border-radius: 8px; cursor: pointer; box-shadow: none;">Eliminar</button>
                        </td>
                    `;
                    inventoryTable.appendChild(tr);
                });
            });

            const logsRef = ref(db, 'historial');
            onValue(logsRef, (snapshot) => {
                logsContainer.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    logsContainer.innerHTML = `<p style="text-align: center; color: #9ca3af;">Sin actividad reciente.</p>`;
                    return;
                }
                const logsArray = Object.values(data).reverse().slice(0, 15);
                logsArray.forEach((log) => {
                    const div = document.createElement('div');
                    div.className = "log-item";
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; color: #94a3b8; font-size: 10px; margin-bottom: 6px;">
                            <span style="font-weight: 800; color: var(--primary);">${log.usuario}</span>
                            <span>${log.fecha}</span>
                        </div>
                        <div style="color: #334155;">${log.detalle}</div>
                    `;
                    logsContainer.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
