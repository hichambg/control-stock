<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock en Tiempo Real</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen p-3 sm:p-6">

    <!-- LOGIN RÁPIDO ADAPTADO A MÓVIL -->
    <div id="loginContainer" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 sm:p-8 mt-12">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">👤 Identifícate</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Tu Nombre</label>
                <input type="text" id="nombreUsuario" required class="w-full border rounded px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Hicham">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded text-sm transition">Entrar al Inventario</button>
        </form>
    </div>

    <!-- APLICACIÓN PRINCIPAL RESPONSIVA -->
    <div id="appContainer" class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 sm:p-6 hidden">
        <!-- Cabecera -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-3">
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800">📦 Control de Stock</h1>
            <div class="flex items-center justify-between w-full sm:w-auto space-x-3">
                <span id="userDisplay" class="text-xs font-semibold bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-200 truncate max-w-[200px]"></span>
                <button onclick="cambiarUsuario()" class="text-xs text-red-600 hover:text-red-800 underline font-medium">Cambiar</button>
            </div>
        </div>

        <!-- Formulario para añadir productos (Adaptado a móviles) -->
        <form id="productForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6 bg-gray-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Referencia</label>
                <input type="text" id="ref" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. REF-001">
            </div>
            <div class="sm:col-span-1 lg:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
                <input type="text" id="nombre" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Taladro Percutor">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Stock Inicial</label>
                <input type="number" id="stock" required min="0" value="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2 lg:col-span-4 text-right">
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded text-sm transition">Añadir Producto</button>
            </div>
        </form>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Tabla de Inventario -->
            <div class="lg:col-span-2 overflow-x-auto">
                <h2 class="text-base sm:text-lg font-bold text-gray-700 mb-3">Listado de Artículos</h2>
                <div class="border rounded-lg overflow-hidden">
                    <table class="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                            <tr class="bg-gray-200 text-gray-700 text-xs uppercase tracking-wider">
                                <th class="py-3 px-3">Ref</th>
                                <th class="py-3 px-3">Producto</th>
                                <th class="py-3 px-3 text-center">Stock</th>
                                <th class="py-3 px-3 text-center">Movimiento</th>
                                <th class="py-3 px-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable" class="divide-y divide-gray-200 text-sm text-gray-700">
                            <tr><td colspan="5" class="text-center py-4 text-gray-400">Cargando productos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Registro de Actividad (Logs) -->
            <div class
